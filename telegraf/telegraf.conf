[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000

###############################################################################
# Kafka -> telemetry.raw
###############################################################################
[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["telemetry.raw"]
  consumer_group = "telegraf-telemetry-raw"

  data_format = "json"
  name_override = "telemetry_raw"

  json_time_key = "timestamp"
  json_time_format = "unix"

  tag_keys = ["origin_type", "sensor_id"]

###############################################################################
# Kafka -> telemetry.short_aggregation
###############################################################################
[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["telemetry.short_aggregation"]
  consumer_group = "telegraf-short-aggregation"

  data_format = "json"
  name_override = "telemetry_short_aggregation"

  json_time_key = "timestamp_short"
  json_time_format = "unix"

  tag_keys = ["registry_type"]

###############################################################################
# Kafka -> daily.climate.bhc
###############################################################################
[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["daily.climate.bhc"]
  consumer_group = "telegraf-daily-bhc"

  data_format = "json"
  name_override = "daily_climate_bhc"

  json_time_key = "timestamp"
  json_time_format = "unix"

  tag_keys = ["registry_type", "sensor_id"]

###############################################################################
# Telegraf -> InfluxDB
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"