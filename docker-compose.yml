services:
  mosquitto:
      image: dhi.io/eclipse-mosquitto:2
      ports:
        - "1883:1883"
        - "9001:9001"
      volumes:
        - ./mosquitto/config/:/mosquitto/config/
        - ./mosquitto/data:/mosquitto/data/
        - ./mosquitto/log:/mosquitto/log/
      healthcheck:
        test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "ok"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 5s
      networks:
        - vineyard-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vineyard-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
      - "29092:29092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_NUM_PARTITIONS=2
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vineyard-network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka: 
        condition: service_healthy
    command: >
      sh -c "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telemetry.raw --partitions 1 --replication-factor 1 &&
             sleep 2 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic daily.climate.api --partitions 1 --replication-factor 1 &&
             sleep 2 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telemetry.short_aggregation --partitions 2 --replication-factor 1 &&
             sleep 2 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic daily.climate.data --partitions 2 --replication-factor 1 &&
             sleep 2 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic daily.climate.eto --partitions 2 --replication-factor 1 &&
             sleep 2 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic daily.climate.bhc --partitions 2 --replication-factor 1"
    networks:
      - vineyard-network

  influxdb:
    image: influxdb:2.7
    container_name: vinhedo_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=influx_secret_pass
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    restart: unless-stopped
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - vineyard-network

  telegraf:
    image: telegraf:1.28-alpine
    container_name: vinhedo_telegraf
    restart: always
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_started
    networks:
      - vineyard-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: vinhedo_grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/grafana_storage:/var/lib/grafana
    networks:
      - vineyard-network

  flink-jobmanager:
    build: ./flink
    container_name: flink_jobmanager
    ports:
      - "8081:8081" 
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    networks:
      - vineyard-network

  flink-taskmanager:
    build: ./flink
    container_name: flink_taskmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=8 
    depends_on:
      - flink-jobmanager
    networks:
      - vineyard-network

  short_term_aggregator_job:
    build: ./flink
    volumes: [ "./pre_processor:/app" ]
    environment: 
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_CONSUME=telemetry.raw
      - KAFKA_TOPIC_PRODUCE=telemetry.short_aggregation
    command: flink run -m flink-jobmanager:8081 -jar /opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar -py /app/short_term_aggregator_job.py
    depends_on: { kafka-init: { condition: service_completed_successfully }, flink-taskmanager: { condition: service_started } }
    networks: [ vineyard-network ]

  daily_aggregator_job:
    build: ./flink
    volumes: [ "./pre_processor:/app" ]
    environment:  
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_CONSUME_1=telemetry.raw
      - KAFKA_TOPIC_CONSUME_2=daily.climate.api
      - KAFKA_TOPIC_PRODUCE=daily.climate.data
    command: flink run -m flink-jobmanager:8081 -jar /opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar -py /app/daily_aggregator_job.py
    depends_on: { kafka-init: { condition: service_completed_successfully }, flink-taskmanager: { condition: service_started } }
    networks: [ vineyard-network ]

  evapotranspiration_job:
    build: ./flink
    volumes: [ "./pre_processor:/app" ]
    environment:  
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_CONSUME=daily.climate.data
      - KAFKA_TOPIC_PRODUCE=daily.climate.eto
    command: flink run -m flink-jobmanager:8081 -jar /opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar -py /app/evapotranspiration_job.py
    depends_on: { daily_aggregator_job: { condition: service_started } }
    networks: [ vineyard-network ]

  bhc_job:
    build: ./flink
    volumes: [ "./pre_processor:/app" ]
    environment: 
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_CONSUME=daily.climate.eto
      - KAFKA_TOPIC_PRODUCE=daily.climate.bhc
    command: flink run -m flink-jobmanager:8081 -jar /opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar -py /app/bhc_job.py
    depends_on: { evapotranspiration_job: { condition: service_started } }
    networks: [ vineyard-network ]

  ingestor:
    build: ./ingestor
    container_name: app_ingestor
    restart: always
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=uva/mesa/vitoria/leitura
      - KAFKA_SERVER=kafka:29092
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
      - KAFKA_TOPIC_SENSOR=telemetry.raw
      - KAFKA_TOPIC_API=daily.climate.api
      - POLLER_INTERVAL_SECONDS=86400
    volumes:
      - ./models:/usr/src/app/models
      - ./ingestor/log/:/usr/src/app/log/
    depends_on: {mosquitto: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    networks:
      - vineyard-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_INFLUX_URL: http://localhost:8086
        VITE_INFLUX_ORG: ${INFLUXDB_ORG}
        VITE_INFLUX_BUCKET: ${INFLUXDB_BUCKET}
        VITE_INFLUX_TOKEN: ${INFLUXDB_TOKEN}
        VITE_BHC_MEASUREMENT: daily_climate_bhc
    container_name: app_frontend
    ports:
      - "5173:80"
    depends_on:
    - influxdb
    restart: unless-stopped
    networks:
      - vineyard-network

volumes:
  postgres_data:
    driver: local
  influxdb_data:
    driver: local

networks:
  vineyard-network:
    driver: bridge